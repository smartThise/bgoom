[package]
name = "bgoom_typst"
version = "0.1.0"
edition = "2021"

[lib]
name = "bgoom_typst"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "0.21"
typst = "0.14.2"
typst-pdf = "0.14.2"
typst-assets = { version = "0.14.2", features = ["fonts"] }
tylax = "0.3.8"
comemo = "0.5"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"
